# Render Blueprint — Balaji CRM backend.
#
# Deploys three things: a Postgres database, the FastAPI API, and the WhatsApp
# extraction worker. The Next.js frontend goes to Vercel instead (see
# docs/DEPLOYMENT.md); Render would happily host it, but Vercel is where the
# App Router's caching and image handling are tuned.
#
# The WhatsApp *gateway* is here too, but commented out and on a paid plan for
# reasons worth reading before uncommenting it — see its section below.

databases:
  - name: balaji-db
    databaseName: balaji_crm
    plan: free
    # Managed Postgres gives a single owner role. Migration 0001 detects that
    # and skips the GRANT/REVOKE hardening; docs/DEPLOYMENT.md explains how to
    # restore the database-level audit_log guarantee if you want it.

services:
  # ----------------------------------------------------------------- API
  - type: web
    name: balaji-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run in the start command, not a preDeployCommand, because
    # Pre-Deploy Commands are a paid-tier feature and this blueprint has to
    # work on free. `alembic upgrade head` is idempotent — a boot with nothing
    # to apply is a no-op — and free runs a single instance, so there is no
    # concurrent-migration race. If you move to a paid plan with several
    # instances, lift this into preDeployCommand instead.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: balaji-db
          property: connectionString
      # Generated once by Render and kept stable across deploys. Rotating it
      # invalidates every live session, which is the intended behaviour if a
      # secret ever leaks.
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_INGEST_SECRET
        generateValue: true
      # Set this to your Vercel domain after the frontend is deployed.
      # Without it the browser blocks every API call as a CORS failure.
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Background Workers are not offered on Render's free plan, so on that
      # plan the worker below cannot exist and nothing turns messages into
      # listings — they arrive, sit as `pending`, and the feed shows a healthy
      # connection producing no inventory. Set this to true and the same loop
      # runs inside the API instead. Safe alongside a real worker: claiming
      # uses SELECT ... FOR UPDATE SKIP LOCKED, so two extractors divide the
      # queue rather than duplicate it.
      - key: EXTRACTION_IN_API
        value: "false"
      - key: SESSION_IDLE_DAYS
        value: "30"
      - key: SESSION_ABSOLUTE_DAYS
        value: "90"
      - key: MAX_PAGE_SIZE
        value: "50"
      - key: LIST_RATE_LIMIT_PER_MINUTE
        value: "60"

  # ------------------------------------------------- WhatsApp extraction
  - type: worker
    name: balaji-extraction-worker
    runtime: python
    plan: starter          # background workers are not available on the free plan
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.whatsapp
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: balaji-db
          property: connectionString
      # Must match the API's key. Without it the worker exits on startup with
      # an actionable message rather than silently failing every message.
      - key: GROQ_API_KEY
        sync: false
      # Groq retires model names on a fairly short cycle and this one is
      # already gone — pinning it made every extraction 404 while the feed
      # reported a healthy connection. Check console.groq.com/docs/models when
      # extraction starts failing; app/config.py holds the current default.
      - key: EXTRACTION_MODEL
        value: openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b
      - key: EXTRACTION_SCHEMA_MODE
        value: auto

  # ------------------------------------------------ WhatsApp gateway
  #
  # Holds the WhatsApp Web session and forwards group messages to the ingest
  # webhook. Read the trade-off before deploying this, because it is a real
  # one:
  #
  #   * It drives a real WhatsApp account over an unofficial integration. Run
  #     on an office machine, the blast radius of that is somewhere the firm
  #     can see and unplug. Run here, it is on a third party's infrastructure
  #     and the linked-device credential lives on their disk.
  #   * Against that: a laptop is asleep, closed, or on a train, and every
  #     message posted while the gateway is down is missed outright — it reads
  #     live traffic and never history. An always-on host is the only thing
  #     that actually fixes that.
  #
  # This is NOT free. A background worker is `starter`, and disks are a paid
  # feature. The disk is what makes it safe to restart: without it the session
  # is wiped on every deploy and the account is re-linked each time, which is
  # the single most account-flagging thing this process can do.
  - type: worker
    name: balaji-whatsapp-gateway
    runtime: node
    plan: starter
    rootDir: gateway
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: wa-session
      # Deliberately outside /opt/render/project, which is restored from the
      # repo on every deploy. The gateway checks this at boot and warns if the
      # session directory is somewhere ephemeral.
      mountPath: /var/whatsapp
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # This directory IS the WhatsApp login — anyone who copies it can read
      # every group the account is in.
      - key: WHATSAPP_AUTH_DIR
        value: /var/whatsapp/session
      # Messages journalled here the moment they arrive, removed once the API
      # acknowledges them. On the disk for the same reason: a restart mid-batch
      # must not lose what had not been delivered yet.
      - key: OUTBOX_FILE
        value: /var/whatsapp/outbox.jsonl
      # Copied from the API rather than set twice. A mismatch here is refused
      # with a 403 on every request and looks identical, from the CRM, to a
      # gateway that is not running at all.
      - key: WHATSAPP_INGEST_SECRET
        fromService:
          type: web
          name: balaji-api
          envVarKey: WHATSAPP_INGEST_SECRET
      # The API's public URL. Not derivable in a blueprint — `fromService` can
      # yield a host or a port but not a URL — so it is filled in by hand once
      # the API has a domain.
      - key: API_BASE_URL
        sync: false
